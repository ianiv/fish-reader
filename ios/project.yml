# xcodegen spec: `xcodegen generate` -> ArticleReader.xcodeproj (gitignored).
# Your team and bundle prefix go in Local.xcconfig (see Config.xcconfig). The app group is shared by the app and
# the share extension (server URL in its defaults, token in its keychain group).
name: ArticleReader
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ArticleReader:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["AppIcon.icon/**", "AppIcon.icon"]
      - Shared
      - path: App/AppIcon.icon  # Icon Composer document (layered Liquid Glass icon)
        type: file
        buildPhase: resources
    dependencies:
      - target: ReadAloud
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Reader
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        CFBundleURLTypes:  # fishreader://pair?server=…&token=… (the QR code from scripts/pair.py)
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [fishreader]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        AppGroup: $(APP_GROUP)
    entitlements:
      path: App/ArticleReader.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).FishReader
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ReadAloud:
    type: app-extension
    platform: iOS
    sources: [ShareExtension, Shared]
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Read Aloud
        AppGroup: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionJavaScriptPreprocessingFile: GetPage
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
    entitlements:
      path: ShareExtension/ReadAloud.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).FishReader.ReadAloud
  ArticleReaderTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: ArticleReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).FishReaderTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ArticleReader:
    build:
      targets:
        ArticleReader: all
        ArticleReaderTests: [test]
    test:
      targets: [ArticleReaderTests]
